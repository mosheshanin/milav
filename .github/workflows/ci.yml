# Проверки на каждый пуш и pull request: типы, тесты, сборка и сквозной тест в Chromium.
# Сквозной тест разбит на группы (tools/e2e-group.mjs), группы идут одновременно на разных машинах: полный прогон
# около 10 минут вместо 42 (24.11.2026). Репозиторий публичный, стандартные машины GitHub для него бесплатны.
# Что запускать, решает задание «Что изменилось» (docs/DEPLOY.md, «Сквозной тест в CI»):
#   full     изменился код, тесты, настройки или урок алфавита: все группы;
#   lessons  изменились только уроки (JSON), картинки, озвучка, документы: одна группа `changed`, только эти уроки;
#   none     изменились только картинки, озвучка, документы и юнит-тесты: сквозной тест не нужен.
# Сравнение идёт с последним успешным прогоном CI в этой ветке, поэтому отменённый или упавший прогон ничего не теряет.
# Общий итог сквозного теста одной строкой: задание «Сквозной тест (итог)».
# Деплой на Cloudflare от этого workflow не зависит: там свои проверки в команде сборки (docs/DEPLOY.md).
name: CI

on:
  push:
  pull_request:
  # Полный сквозной тест по кнопке (вкладка Actions → CI → Run workflow).
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет ещё идущий прогон предыдущего.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: Что изменилось
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      lessons: ${{ steps.scope.outputs.lessons }}
      groups: ${{ steps.scope.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scope=full
          lessons=""
          if [ "${{ github.event_name }}" = "push" ]; then
            # Последний успешный прогон CI в этой ветке: всё, что менялось после него, ещё не проверено сквозным тестом.
            base=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=${{ github.ref_name }}&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' || true)
            if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null && files=$(git diff --name-only "$base" "${{ github.sha }}"); then
              code=false
              ids=""
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  content/lessons/alphabet-*) code=true ;;
                  content/lessons/*.json)
                    # Удалённый урок проверять нечем; достаточно быстрых тестов.
                    [ -f "$f" ] && ids="$ids $(basename "$f" .json)"
                    ;;
                  content/registry.ts|content/manifest.json|apps/web/public/audio/*|apps/web/public/words/*|apps/web/src/lib/homeEmoji.ts|docs/*|*.md) ;;
                  # Только тесты: их гоняет быстрая работа «Типы, тесты, сборка», сквозному тесту они не нужны.
                  *.test.ts|apps/api/src/test-utils/*) ;;
                  *) code=true ;;
                esac
              done <<< "$files"
              ids=$(echo $ids | tr ' ' '\n' | sort -u | tr '\n' ' ')
              count=$(echo $ids | wc -w)
              if [ "$code" = true ] || [ "$count" -gt 8 ]; then
                scope=full
              elif [ "$count" -gt 0 ]; then
                scope=lessons
                lessons=$(echo $ids | tr ' ' ',')
              else
                scope=none
              fi
            fi
          fi
          case "$scope" in
            full) groups=$(node tools/e2e-group.mjs --list) ;;
            lessons) groups='["changed"]' ;;
            *) groups='["none"]' ;;  # задание всё равно пропускается (if), но пустую матрицу GitHub не принимает
          esac
          echo "Что запускать: $scope ${lessons:+(уроки: $lessons)}, группы: $groups"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "lessons=$lessons" >> "$GITHUB_OUTPUT"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  checks:
    name: Типы, тесты, сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Типы
        run: npm run typecheck

      # Те же тесты входят и в «Тесты» ниже; отдельный шаг нужен, чтобы ошибку в контенте было видно сразу в названии шага.
      - name: Контент (схема, правила, реестр)
        run: npm run validate:content

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

  e2e:
    name: "Сквозной тест: ${{ matrix.group }}"
    needs: changes
    if: needs.changes.outputs.scope != 'none'
    runs-on: ubuntu-24.04
    # Самая долгая группа идёт около 8 минут; запас на медленную машину.
    timeout-minutes: 25
    strategy:
      # Упавшая группа не останавливает остальные: видно сразу всё, что сломалось.
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.groups) }}
    env:
      # Куда ставится Chromium; tools/e2e-lesson.mjs ищет его по этой переменной.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка фронтенда
        run: npm run build

      - name: Кэш браузера
        uses: actions/cache@v4
        with:
          path: .pw-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Без --with-deps (24.11.2026): системные библиотеки Chromium на машине GitHub уже есть, а --with-deps каждый раз
      # ставил через apt только шрифты (японские, китайские, юникод), которые приложению не нужны (у него свои шрифты).
      # Шесть групп одновременно качали их с зеркала Ubuntu по 100 КБ/с: до 5 минут на группу вместо 30 секунд.
      - name: Установка Chromium
        run: npx playwright-core install chromium

      - name: Локальная база (миграции)
        run: npx wrangler d1 migrations apply milav-db --local --env local

      - name: Запуск Worker
        run: |
          npx wrangler dev --env local > wrangler-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8787/api/health > /dev/null; then
              echo "Worker отвечает (попытка $i)"
              exit 0
            fi
            sleep 1
          done
          echo "Worker не запустился за 90 с"
          cat wrangler-dev.log
          exit 1

      # Шаги группы и что каждый проверяет: tools/e2e-group.mjs. Упавший шаг виден в аннотациях прогона.
      - name: Сквозной тест
        env:
          LESSONS: ${{ needs.changes.outputs.lessons }}
        run: node tools/e2e-group.mjs "${{ matrix.group }}" e2e-shots

      - name: Скриншоты и лог Worker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-${{ matrix.group }}
          path: |
            e2e-shots
            wrangler-dev.log
          if-no-files-found: ignore

  # Одна строка итога для всех групп: зелёная, если все группы прошли (или сквозной тест не был нужен).
  e2e-result:
    name: Сквозной тест (итог)
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "Что изменилось: ${{ needs.changes.result }}, сквозной тест: ${{ needs.e2e.result }}"
          case "${{ needs.e2e.result }}" in
            success|skipped) [ "${{ needs.changes.result }}" = success ] || exit 1 ;;
            *) exit 1 ;;
          esac
