# Озвучка слов через Google Cloud Text-to-Speech. Запускается вручную: Actions → Озвучка слов → Run workflow.
# Нужен секрет репозитория GOOGLE_TTS_API_KEY (см. docs/AUDIO.md).
name: Озвучка слов

on:
  workflow_dispatch:
    inputs:
      action:
        description: "voices — список голосов, review — файлы для прослушивания, publish — боевая озвучка в репозиторий"
        type: choice
        options: [voices, review, publish]
        default: voices
      voice:
        description: "Голос, например he-IL-Wavenet-A (список даёт действие voices)"
        default: he-IL-Wavenet-A
      text:
        description: "Для publish: что отправлять в синтезатор"
        type: choice
        options: [niqqud, plain]
        default: niqqud
      force:
        description: "Для publish: перезаписать уже готовые файлы"
        type: boolean
        default: false
      only:
        description: "Для publish: только эти слова и буквы (id через запятую), например после правок носителя"
        default: ""

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    env:
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Зависимости нужны только боевой озвучке: после неё пересобирается манифест уроков (content:index).
      - name: Установка зависимостей
        if: inputs.action == 'publish'
        run: npm ci

      - name: Список голосов
        if: inputs.action == 'voices'
        run: node tools/generate-audio.mjs --voices

      - name: Файлы для прослушивания
        if: inputs.action == 'review'
        run: node tools/generate-audio.mjs --review --voice "${{ inputs.voice }}"

      - name: Загрузить файлы для прослушивания
        if: inputs.action == 'review'
        uses: actions/upload-artifact@v4
        with:
          name: audio-review-${{ inputs.voice }}
          path: audio-review

      - name: Боевая озвучка
        if: inputs.action == 'publish'
        # Список id приходит через переменную окружения и проверяется: в команду попадают только id уроков.
        env:
          ONLY: ${{ inputs.only }}
        run: |
          ONLY_ARGS=()
          if [ -n "$ONLY" ]; then
            if ! [[ "$ONLY" =~ ^[a-z0-9,-]+$ ]]; then echo "only: только id через запятую"; exit 1; fi
            ONLY_ARGS=(--only "$ONLY")
          fi
          node tools/generate-audio.mjs --voice "${{ inputs.voice }}" --text "${{ inputs.text }}" --update-content ${{ inputs.force && '--force' || '' }} "${ONLY_ARGS[@]}"

      # Поле audio в уроке меняет его версию: манифест приложения пересобирается, иначе тест манифеста остановит выкладку.
      - name: Манифест уроков
        if: inputs.action == 'publish'
        run: npm run content:index

      - name: Сохранить в репозиторий
        if: inputs.action == 'publish'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/audio content/lessons content/manifest.json content/registry.ts
          git diff --cached --quiet && echo "Нечего сохранять" && exit 0
          git commit -m "Озвучка слов: ${{ inputs.voice }}, текст ${{ inputs.text }}"
          git push
